hardware:
  device: "cuda"                  # "cuda" or "cpu"
  precision: "fp16"               # "fp16" or "fp32"
  device_id: 0

detection:
  model_name: "scrfd_2.5g_kps"
  model_path: "models/scrfd_2.5g_kps.onnx"
  confidence_threshold: 0.30
  nms_threshold: 0.4
  input_size: [640, 640]

recognition:
  primary_model: "kprpe_adaface"
  model_path: "models/kprpe_adaface.onnx"
  embedding_size: 512
  input_size: [112, 112]
  match_threshold: 0.53           # Certain Match Threshold (Production Baseline >= 0.53)
  margin_threshold: 0.04          # Top-1 vs Top-2 Margin Delta Gate
  unknown_threshold: 0.35         # Below 0.35 is UNKNOWN

quality:
  min_face_size: 120              # 120px Gate trigger threshold
  min_detection_confidence: 0.30
  min_sharpness: 25.0
  max_yaw: 55.0
  max_pitch: 45.0
  max_roll: 45.0
  min_brightness: 5.0
  max_brightness: 250.0

temporal:
  confirmation_count: 3           # 3-Frame Temporal Consensus Gate
  temporal_window_frames: 10
  min_average_similarity: 0.48    # Multi-frame consensus minimum similarity
  min_agreement_ratio: 0.6

attendance:
  cooldown_seconds: 30            # 30-second cooldown for repeat entries

database:
  url: "sqlite:///data/attendance.db"
  sqlite_fallback_url: "sqlite:///data/attendance.db"

storage:
  photos_dir: "Employees_Photo"
  gallery_dir: "data/embeddings"
  reports_dir: "data/enrollment_reports"
